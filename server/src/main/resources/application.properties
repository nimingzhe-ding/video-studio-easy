spring.application.name=video-studio-easy
server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}

# ---------- 存储 ----------
app.storage.root=${STORAGE_ROOT:./data}
app.storage.max-upload-bytes=${MAX_UPLOAD_BYTES:2147483648}

# ---------- 分片上传 ----------
# 单片大小：断线最多重传这一片；2 小时的 1080p 视频约 1.5GB → 约 190 片
app.upload.chunk-size-bytes=${UPLOAD_CHUNK_SIZE:8388608}
app.upload.max-chunks=${UPLOAD_MAX_CHUNKS:20000}
# 未完成会话的保留时长，超时会被清理任务回收
app.upload.retention-hours=${UPLOAD_RETENTION_HOURS:24}

# H2 文件库：REAL 场景可替换为 MySQL（仅需改 datasource）
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/db/video-studio;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=true

# 上传与异步任务
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:2147483648}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_BYTES:2147483648}
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:300000}

# ---------- 本地媒体工具 ----------
app.media.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.media.ffprobe=${FFPROBE_PATH:ffprobe}
app.media.ocr=${OCR_COMMAND:tesseract}
app.media.ocr-languages=${OCR_LANGUAGES:chi_sim+eng}
app.media.ffmpeg-timeout-seconds=${FFMPEG_TIMEOUT_SECONDS:900}
app.media.ocr-timeout-seconds=${OCR_TIMEOUT_SECONDS:120}
# 场景阈值取很低是因为静态幻灯片/白板类视频的真实场景分常低于 0.01，
# 去重交给「最短间隔 + OCR 文本判重」，阈值只负责尽量不漏掉切换点。
app.media.frame-scene-threshold=${FRAME_SCENE_THRESHOLD:0.006}
app.media.frame-fallback-interval-seconds=${FRAME_FALLBACK_INTERVAL_SECONDS:20}
app.media.frame-max-count=${FRAME_MAX_COUNT:400}
app.media.frame-width=${FRAME_WIDTH:960}
app.media.asr-segment-seconds=${ASR_SEGMENT_SECONDS:60}
# 分片并行度：语音切片与关键帧 OCR 都会按这个并发跑，长视频耗时从线性降到 1/N
app.media.asr-concurrency=${ASR_CONCURRENCY:3}
app.media.ocr-concurrency=${OCR_CONCURRENCY:3}
app.media.segment-seconds=${CONTEXT_SEGMENT_SECONDS:60}

# ---------- 模型网关（OpenAI 兼容）----------
# 默认走 DashScope 兼容模式（qwen-long / qwen-plus / qwen-vl-max / paraformer / text-embedding-v3）
ai.mode=${AI_MODE:auto}
ai.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${LLM_MODEL:qwen-plus}
ai.audio-model=${ASR_MODEL:qwen-audio-asr}
ai.vision-model=${VISION_MODEL:qwen-vl-max}
ai.embedding-model=${EMBEDDING_MODEL:text-embedding-v3}
ai.embedding-base-url=${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.embedding-api-key=${EMBEDDING_API_KEY:}
ai.timeout-seconds=${LLM_TIMEOUT_SECONDS:180}
ai.max-retries=${LLM_MAX_RETRIES:3}
ai.dry-run=${AI_DRY_RUN:false}

# ---------- 语音识别 ----------
# 云端走 OpenAI 兼容的 /audio/transcriptions（DashScope compatible-mode 同样支持）
ai.asr-url=${ASR_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
ai.asr-timeout-seconds=${ASR_TIMEOUT_SECONDS:300}

# 本地 whisper.cpp 回退；命令为空表示禁用
app.asr.whisper.command=${WHISPER_COMMAND:}
app.asr.whisper.model=${WHISPER_MODEL:}
app.asr.whisper.language=${WHISPER_LANGUAGE:auto}
app.asr.whisper.threads=${WHISPER_THREADS:4}
app.asr.whisper.timeout-seconds=${WHISPER_TIMEOUT_SECONDS:1800}

# ---------- Realtime 直通（浏览器音视频 -> 云端实时模型）----------
# 形如 wss://dashscope.aliyuncs.com/api-ws/v1/realtime?model=qwen3-omni-flash-realtime
realtime.enabled=${REALTIME_ENABLED:true}
realtime.url=${REALTIME_URL:}
realtime.api-key=${REALTIME_API_KEY:}
realtime.model=${REALTIME_MODEL:qwen3-omni-flash-realtime}

# ---------- Agent ----------
agent.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.max-duration-ms=${AGENT_MAX_DURATION_MS:180000}
agent.max-context-chars=${AGENT_MAX_CONTEXT_CHARS:24000}
agent.chunk-seconds=${CHUNK_SECONDS:300}
agent.top-k-chunks=${RETRIEVAL_TOP_K:3}
agent.max-evidence-segments=${RETRIEVAL_MAX_SEGMENTS:8}

logging.level.root=INFO
logging.level.com.videostudio=INFO
