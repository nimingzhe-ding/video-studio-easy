spring.application.name=video-studio-easy
server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}

# ---------- 存储 ----------
app.storage.root=${STORAGE_ROOT:./data}
app.storage.max-upload-bytes=${MAX_UPLOAD_BYTES:2147483648}

# ---------- 分片上传 ----------
# 单片大小：断线最多重传这一片；2 小时的 1080p 视频约 1.5GB → 约 190 片
app.upload.chunk-size-bytes=${UPLOAD_CHUNK_SIZE:8388608}
app.upload.max-chunks=${UPLOAD_MAX_CHUNKS:20000}
# 未完成会话的保留时长，超时会被清理任务回收
app.upload.retention-hours=${UPLOAD_RETENTION_HOURS:24}

# 默认是 H2 文件库，clone 下来不装任何中间件就能跑。
# 设了 DB_URL 就切到 MySQL——schema.sql 是 MySQL 方言，H2 用 MODE=MySQL 也认（已验证）。
# 容器部署时由 compose 传入 mysql:3306 那套地址。
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/db/video-studio;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}
spring.datasource.hikari.maximum-pool-size=10
# 连接池取连接最多等 10 秒：MySQL 容器还没起来时快速失败，而不是卡在启动阶段
spring.datasource.hikari.connection-timeout=10000

# ---------- Redis（可选）----------
# 关闭时：任务提交靠进程内锁去重、SSE 靠轮询数据库、LLM 配额记在内存里。
# 开启后：跨实例互斥、事件跨实例广播、配额全局共享。Redis 挂掉只会退化成单机行为，不影响分析。
app.redis.enabled=${REDIS_ENABLED:false}
# 锁 TTL 必须大于单次操作耗时，否则还没写完就过期，互斥失效
app.redis.lock-ttl-seconds=${REDIS_LOCK_TTL_SECONDS:30}
# 前端点两下的间隔远小于这个值；等待超过它就直接返回 409，不阻塞 Tomcat 线程
app.redis.lock-wait-millis=${REDIS_LOCK_WAIT_MILLIS:800}
app.redis.event-ttl-minutes=${REDIS_EVENT_TTL_MINUTES:30}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

# ---------- 对象存储（可选）----------
# 启用后媒体、关键帧、报告都走 MinIO；未启用时落本地磁盘（app.storage.root）。
app.object-storage.enabled=${OBJECT_STORAGE_ENABLED:false}
app.object-storage.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
app.object-storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.object-storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.object-storage.bucket=${MINIO_BUCKET:video-studio}
# 浏览器直连对象存储时用的前缀；留空表示仍由本服务代理
app.object-storage.public-base-url=${MINIO_PUBLIC_BASE_URL:}

# ---------- 向量库（可选）----------
# 启用后分块向量写入 Milvus，检索走 ANN；未启用或连不上时回退内存余弦。
app.vector.enabled=${VECTOR_ENABLED:false}
app.vector.host=${MILVUS_HOST:127.0.0.1}
app.vector.port=${MILVUS_PORT:19530}
app.vector.collection=${MILVUS_COLLECTION:video_studio_chunks}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=true

# 上传与异步任务
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:2147483648}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_BYTES:2147483648}
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:300000}

# ---------- 本地媒体工具 ----------
app.media.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.media.ffprobe=${FFPROBE_PATH:ffprobe}
app.media.ocr=${OCR_COMMAND:tesseract}
app.media.ocr-languages=${OCR_LANGUAGES:chi_sim+eng}
app.media.ffmpeg-timeout-seconds=${FFMPEG_TIMEOUT_SECONDS:900}
app.media.ocr-timeout-seconds=${OCR_TIMEOUT_SECONDS:120}
# 场景阈值取很低是因为静态幻灯片/白板类视频的真实场景分常低于 0.01，
# 去重交给「最短间隔 + OCR 文本判重」，阈值只负责尽量不漏掉切换点。
app.media.frame-scene-threshold=${FRAME_SCENE_THRESHOLD:0.006}
app.media.frame-fallback-interval-seconds=${FRAME_FALLBACK_INTERVAL_SECONDS:20}
app.media.frame-max-count=${FRAME_MAX_COUNT:400}
app.media.frame-width=${FRAME_WIDTH:960}
app.media.asr-segment-seconds=${ASR_SEGMENT_SECONDS:60}
# 分片并行度：语音切片与关键帧 OCR 都会按这个并发跑，长视频耗时从线性降到 1/N
app.media.asr-concurrency=${ASR_CONCURRENCY:3}
app.media.ocr-concurrency=${OCR_CONCURRENCY:3}
app.media.segment-seconds=${CONTEXT_SEGMENT_SECONDS:60}
# 说话人分离：纯本地计算（读 PCM 采样点算基频），不产生外部调用
app.media.speaker-separation-enabled=${SPEAKER_SEPARATION_ENABLED:true}
# 音高中位数相差多少个半音判为不同说话人（4 ≈ 大三度）
app.media.speaker-split-semitones=${SPEAKER_SPLIT_SEMITONES:4.0}


# ---------- 模型网关（OpenAI 兼容）----------
# 默认走 DashScope 兼容模式（qwen-long / qwen-plus / qwen-vl-max / paraformer / text-embedding-v3）
ai.mode=${AI_MODE:auto}
ai.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.api-key=${AI_API_KEY:}
ai.model=${LLM_MODEL:qwen-plus}
ai.audio-model=${ASR_MODEL:qwen-audio-asr}
ai.vision-model=${VISION_MODEL:qwen-vl-max}
ai.embedding-model=${EMBEDDING_MODEL:text-embedding-v3}
ai.embedding-base-url=${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.embedding-api-key=${EMBEDDING_API_KEY:}
ai.timeout-seconds=${LLM_TIMEOUT_SECONDS:180}
ai.max-retries=${LLM_MAX_RETRIES:3}
ai.dry-run=${AI_DRY_RUN:false}

# 可选：对 OCR 文字极少的帧调用视觉模型写描述（默认关闭，按帧计费）
ai.vision-caption-enabled=${VISION_CAPTION_ENABLED:false}
ai.vision-caption-max-frames=${VISION_CAPTION_MAX_FRAMES:24}

# ---------- 语音识别 ----------
# 云端走 OpenAI 兼容的 /audio/transcriptions（DashScope compatible-mode 同样支持）
ai.asr-url=${ASR_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
ai.asr-timeout-seconds=${ASR_TIMEOUT_SECONDS:300}

# 本地 whisper.cpp 回退；命令为空表示禁用
app.asr.whisper.command=${WHISPER_COMMAND:}
app.asr.whisper.model=${WHISPER_MODEL:}
app.asr.whisper.language=${WHISPER_LANGUAGE:auto}
app.asr.whisper.threads=${WHISPER_THREADS:4}
app.asr.whisper.timeout-seconds=${WHISPER_TIMEOUT_SECONDS:1800}

# ---------- Realtime 直通（浏览器音视频 -> 云端实时模型）----------
# 形如 wss://dashscope.aliyuncs.com/api-ws/v1/realtime?model=qwen3-omni-flash-realtime
realtime.enabled=${REALTIME_ENABLED:true}
realtime.url=${REALTIME_URL:}
realtime.api-key=${REALTIME_API_KEY:}
realtime.model=${REALTIME_MODEL:qwen3-omni-flash-realtime}

# ---------- Agent ----------
agent.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.max-duration-ms=${AGENT_MAX_DURATION_MS:180000}
agent.max-context-chars=${AGENT_MAX_CONTEXT_CHARS:24000}
agent.chunk-seconds=${CHUNK_SECONDS:300}
agent.top-k-chunks=${RETRIEVAL_TOP_K:3}
agent.max-evidence-segments=${RETRIEVAL_MAX_SEGMENTS:8}
# Word 报告里最多插几张关键帧，0 表示不插图
agent.max-report-figures=${REPORT_MAX_FIGURES:8}

logging.level.root=INFO
logging.level.com.videostudio=INFO
# 日志里带上 traceId 与 jobId：一次失败可以直接 grep 出来，不用靠时间戳猜
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%X{jobId:-}] %logger{36} - %msg%n

# ---------- 限流 ----------
# 目标是挡住脚本刷接口与误操作，不是给正常用户添堵，所以阈值比较宽松
rate.submit-per-minute=${RATE_SUBMIT_PER_MINUTE:12}
rate.upload-per-minute=${RATE_UPLOAD_PER_MINUTE:30}
rate.chat-per-minute=${RATE_CHAT_PER_MINUTE:40}
rate.realtime-per-minute=${RATE_REALTIME_PER_MINUTE:30}

# ---------- 成本预算 ----------
# 一次长视频分析可能触发几十次模型调用；没有上限时一次死循环就能刷掉几百块
budget.max-tokens-per-job=${BUDGET_MAX_TOKENS_PER_JOB:2000000}
budget.max-tokens-per-day=${BUDGET_MAX_TOKENS_PER_DAY:20000000}
# 仅用于日志里给出金额，按你实际用的模型单价填
budget.price-per-million-tokens=${BUDGET_PRICE_PER_MILLION:2.0}

# ---------- 可观测性 ----------
# 只暴露必要端点：health / info / prometheus。默认的 env、beans 会把配置和内部结构暴露给任何能访问的人。
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=video-studio-easy
# 任务耗时直方图：没有它就只能拿到平均值，看不出长尾
management.metrics.distribution.percentiles-histogram.videostudio_job_duration_seconds=true
management.metrics.distribution.percentiles-histogram.videostudio_stage_duration_seconds=true
