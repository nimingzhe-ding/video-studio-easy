spring.application.name=video-studio
server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
# 生产入口是 HTTPS 反向代理（见部署说明）。用 native 让 Tomcat 的 RemoteIpValve
# 从 X-Forwarded-For / X-Forwarded-Proto 取真实来源，否则所有请求的 remoteAddr
# 都是代理地址，按 IP 的登录/注册限流会退化成全站共享一个桶。
# RemoteIpValve 只信任内网代理发来的转发头：应用被直接暴露时，外部伪造的头不生效。
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
spring.session.redis.namespace=video-studio:sessions

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
app.redis.lock-ttl-seconds=30

rocketmq.name-server=${ROCKETMQ_NAME_SERVER}
rocketmq.producer.group=video-studio-producer
rocketmq.producer.send-message-timeout=5000
rocketmq.topic.analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis}
rocketmq.consumer.group=${ROCKETMQ_CONSUMER_GROUP:video-studio-workers}
rocketmq.producer.access-key=${ROCKETMQ_ACCESS_KEY:}
rocketmq.producer.secret-key=${ROCKETMQ_SECRET_KEY:}
rocketmq.consumer.access-key=${ROCKETMQ_ACCESS_KEY:}
rocketmq.consumer.secret-key=${ROCKETMQ_SECRET_KEY:}

# 发件箱投递节奏：每 2 秒扫一轮待投递记录
queue.outbox-interval-ms=${QUEUE_OUTBOX_INTERVAL_MS:2000}
# 执行者失联回收：超过 stale-minutes 没有进度更新、且 worker 锁无人持有，任务才被重新排队
worker.stale-minutes=${WORKER_STALE_MINUTES:15}
# 自动重跑次数上限，超过后置为 FAILED 交给人工，避免反复烧钱
worker.max-automatic-requeue=${WORKER_MAX_AUTOMATIC_REQUEUE:3}
worker.stale-check-interval-ms=${WORKER_STALE_CHECK_INTERVAL_MS:60000}

app.object-storage.endpoint=${S3_ENDPOINT}
app.object-storage.access-key=${S3_ACCESS_KEY}
app.object-storage.secret-key=${S3_SECRET_KEY}
app.object-storage.bucket=${S3_BUCKET:video-studio}
vector.qdrant.url=${QDRANT_URL}
vector.qdrant.api-key=${QDRANT_API_KEY}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}
vector.qdrant.dimensions=${EMBEDDING_DIMENSIONS:1024}

# Disposable work files only; all durable files are stored in S3.
app.storage.root=${WORK_ROOT:/tmp/video-studio}
app.storage.max-upload-bytes=${MAX_UPLOAD_BYTES:2147483648}
app.upload.chunk-size-bytes=${UPLOAD_CHUNK_SIZE:8388608}
app.upload.max-chunks=20000
app.upload.retention-hours=24
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_BYTES:2147483648}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_BYTES:2147483648}
spring.mvc.async.request-timeout=300000

app.media.ffmpeg=${FFMPEG_PATH:ffmpeg}
app.media.ffprobe=${FFPROBE_PATH:ffprobe}
app.media.ocr=${OCR_COMMAND:tesseract}
app.media.ocr-languages=${OCR_LANGUAGES:chi_sim+eng}
app.media.ffmpeg-timeout-seconds=900
app.media.ocr-timeout-seconds=120
app.media.frame-scene-threshold=0.006
app.media.frame-fallback-interval-seconds=20
app.media.frame-max-count=400
app.media.frame-width=960
app.media.asr-segment-seconds=60
app.media.asr-concurrency=${ASR_CONCURRENCY:3}
app.media.ocr-concurrency=${OCR_CONCURRENCY:3}
app.media.segment-seconds=60
app.media.speaker-separation-enabled=true
app.media.speaker-split-semitones=4.0

ai.base-url=${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.api-key=${AI_API_KEY}
ai.model=${LLM_MODEL:qwen-plus}
ai.audio-model=${ASR_MODEL:qwen-audio-asr}
ai.vision-model=${VISION_MODEL:qwen-vl-max}
ai.embedding-model=${EMBEDDING_MODEL:text-embedding-v3}
ai.embedding-base-url=${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
ai.embedding-api-key=${EMBEDDING_API_KEY:}
ai.timeout-seconds=${LLM_TIMEOUT_SECONDS:180}
ai.max-retries=3
ai.vision-caption-enabled=${VISION_CAPTION_ENABLED:false}
ai.vision-caption-max-frames=24
ai.asr-url=${ASR_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
ai.asr-timeout-seconds=300

realtime.enabled=${REALTIME_ENABLED:false}
realtime.url=${REALTIME_URL:}
realtime.api-key=${REALTIME_API_KEY:}
realtime.model=${REALTIME_MODEL:qwen3-omni-flash-realtime}
agent.max-rounds=2
agent.max-duration-ms=300000
agent.max-context-chars=24000
agent.chunk-seconds=300
agent.top-k-chunks=3
agent.max-evidence-segments=8
agent.max-report-figures=8

auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:false}
auth.admin-username=${AUTH_ADMIN_USERNAME:}
auth.admin-password=${AUTH_ADMIN_PASSWORD:}
rate.submit-per-minute=12
rate.upload-per-minute=30
rate.chat-per-minute=40
rate.realtime-per-minute=30
budget.max-tokens-per-job=${BUDGET_MAX_TOKENS_PER_JOB:2000000}
budget.max-tokens-per-day=${BUDGET_MAX_TOKENS_PER_DAY:20000000}
# 单用户每日上限：防止一个账户吃光全站额度
budget.max-tokens-per-user-per-day=${BUDGET_MAX_TOKENS_PER_USER_PER_DAY:5000000}
budget.price-per-million-tokens=${BUDGET_PRICE_PER_MILLION:2.0}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.readiness.include=readinessState,db,redis,qdrant,objectStore
management.metrics.tags.application=video-studio
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%X{jobId:-}] %logger{36} - %msg%n
