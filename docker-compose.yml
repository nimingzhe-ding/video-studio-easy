name: video-studio
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: UTC
      MYSQL_DATABASE: video_studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh,-c,'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL",'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      retries: 20
    networks: [backend]

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    command: [server,/data,--console-address,":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [s3-data:/data]
    networks: [backend]

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: video-studio
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        until mc alias set studio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 2; done
        mc mb --ignore-existing studio/$$S3_BUCKET
        mc admin user add studio "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" || true
        # 该镜像没有 sed，策略文件用 printf 生成，避免依赖外部工具
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::%s/*"]}]}\n' "$$S3_BUCKET" "$$S3_BUCKET" > /tmp/policy.json
        mc admin policy create studio studio-app /tmp/policy.json || true
        mc admin policy attach studio studio-app --user "$$S3_ACCESS_KEY"
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY}
    volumes: [qdrant-data:/qdrant/storage]
    networks: [backend]

  rmqnamesrv:
    image: apache/rocketmq:5.3.4
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    networks: [backend]

  # 命名卷由 root 创建，而 broker 以 uid 3000 运行，不先改属主会因不可写而反复重启
  rocketmq-perms:
    image: apache/rocketmq:5.3.4
    user: "0:0"
    entrypoint: ["/bin/sh","-ec"]
    command: ["chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs"]
    volumes:
      - rocketmq-data:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
    networks: [backend]

  rmqbroker:
    image: apache/rocketmq:5.3.4
    restart: unless-stopped
    depends_on:
      rmqnamesrv: {condition: service_started}
      rocketmq-perms: {condition: service_completed_successfully}
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/broker.conf
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - rocketmq-data:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
    networks: [backend]

  rocketmq-init:
    image: apache/rocketmq:5.3.4
    depends_on: [rmqbroker]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m"
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        # mqadmin 出错时退出码依然是 0，所以不能用它判断成功；
        # 以 topicList 里能查到该 topic 作为唯一成功信号，并且限制重试次数。
        i=0
        until sh mqadmin topicList -n rmqnamesrv:9876 | grep -qx video-analysis; do
          i=$$((i+1))
          if [ "$$i" -gt 60 ]; then echo "无法创建 topic video-analysis" >&2; exit 1; fi
          sh mqadmin updateTopic -n rmqnamesrv:9876 -c VideoStudioCluster -t video-analysis -r 8 -w 8 || true
          sleep 3
        done
    networks: [backend]

  app:
    build: {context: .,dockerfile: docker/Dockerfile}
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      rocketmq-init: {condition: service_completed_successfully}
      qdrant: {condition: service_started}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/video_studio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: studio
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROCKETMQ_NAME_SERVER: rmqnamesrv:9876
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      ASR_URL: ${ASR_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions}
      ASR_MODEL: ${ASR_MODEL:-qwen-audio-asr}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:?Set AUTH_ADMIN_USERNAME}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Set AUTH_ADMIN_PASSWORD}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
      REALTIME_URL: ${REALTIME_URL:-}
      REALTIME_API_KEY: ${REALTIME_API_KEY:-}
      VISION_CAPTION_ENABLED: ${VISION_CAPTION_ENABLED:-false}
      TZ: Asia/Shanghai
    ports: ["${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-9090}:9090"]
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770","/work:uid=10001,gid=10001,mode=0770,size=8g"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
networks:
  backend:
volumes:
  mysql-data:
  redis-data:
  s3-data:
  qdrant-data:
  rocketmq-data:
  rocketmq-logs:
